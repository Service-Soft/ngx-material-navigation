<a class="image-link" disableRipple
    [routerLink]="route"
    [target]="elementValue.link.openInNewTab ? '_blank' : '_self'"
    [rel]="elementValue.link.openInNewTab ? 'noreferrer noopener' : undefined"
    [class.sidenavElement]="isSidenavElement"
    [class.menuItem]="isMenuItem"
>
    <!-- eslint-disable-next-line angular/prefer-ngsrc -->
    <img width="auto" [alt]="elementValue.alt" [height]="elementValue.height" [style.height.px]="elementValue.height" [src]="elementValue.url">
</a>
