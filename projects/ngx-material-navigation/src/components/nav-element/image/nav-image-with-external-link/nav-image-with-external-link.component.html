<a class="image-link"
    [href]="elementValue.link.url"
    [target]="elementValue.link.openInNewTab ? '_blank' : '_self'"
    [rel]="elementValue.link.openInNewTab ? 'noreferrer noopener' : undefined"
    [class.sidenavElement]="isSidenavElement"
    [class.menuItem]="isMenuItem"
>
    <img [alt]="elementValue.alt ?? ''" [height]="elementValue.height" [style.height.px]="elementValue.height" [width]="elementValue.width" [style.width.px]="elementValue.width" [ngSrc]="elementValue.url">
</a>
